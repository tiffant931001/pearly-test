/* --- magic v3: softer pink, cross-stitch heart --- */
.halftone{display:none}
.petT::before{background:#FBEAF2}.petT.lp-on::before{opacity:.92}.petT.lp-go::before{background:#F6DCE8;opacity:1}
.aura{width:220px;height:220px;margin:-110px 0 0 -110px;background:radial-gradient(closest-side,rgba(240,182,210,.5),rgba(244,200,222,.22) 60%,rgba(250,225,238,0))}
.petT.lp-go .aura{transform:scale(1.25)}
.motes i::before{filter:drop-shadow(0 0 1.5px rgba(226,140,186,.9))}
.motes i{width:10px;height:10px;left:-5px;top:-5px}
.softs path,.bloom path{filter:drop-shadow(0 0 2px #EDB3CF) drop-shadow(0 0 6px rgba(232,160,198,.5))}
.bloom .b0{width:150px;height:150px;left:-75px;top:-75px}
.petT.lp-on .pet{filter:drop-shadow(0 0 5px rgba(226,150,192,.4));animation:petglow2 1.6s ease-in-out .4s infinite}
@keyframes petglow2{50%{filter:drop-shadow(0 0 9px rgba(226,150,192,.55))}}
.stitchw{position:absolute;left:50%;top:58%;width:0;height:0;z-index:3;pointer-events:none}
.stitch{position:absolute;left:0;top:0;overflow:visible}
.stitch .st,.xc .cx{stroke:#fff;stroke-width:2.2;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 1px rgba(214,140,180,.7))}
.stitch .st{opacity:0}
.petT.lp-on .stitch .st{animation:sew .18s ease-out calc(var(--i) * 12ms) both}
@keyframes sew{from{opacity:0;transform:scale(.2)}to{opacity:.95;transform:none}}
.stitch .st{transform-box:fill-box;transform-origin:center}
.xc{position:absolute;width:28px;height:28px;opacity:0;overflow:visible}
.xc.c1{left:-170px;top:-120px}.xc.c2{left:140px;top:-40px}.xc.c3{left:-160px;top:60px}
.petT.lp-on .xc{animation:xtw 1.8s steps(4) .6s infinite}.petT.lp-on .xc.c2{animation-delay:1.2s}.petT.lp-on .xc.c3{animation-delay:.9s}
@keyframes xtw{0%,100%{opacity:0}30%,60%{opacity:.9}}
.stitchw{top:52%}.petT.lp-on .petw{transform:scale(.62) translateY(40px)}.xc.c1{left:-178px;top:-140px}.xc.c2{left:150px;top:30px}.xc.c3{left:-180px;top:70px}
.petT::before{background-color:#FBEAF2;background-image:linear-gradient(rgba(214,150,186,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(214,150,186,.32) 1px,transparent 1px);background-size:11px 11px;background-position:center center}
.petT.lp-go::before{background-color:#F6DCE8;background-image:linear-gradient(rgba(206,132,174,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(206,132,174,.4) 1px,transparent 1px);background-size:11px 11px;background-position:center center}
.petT::before{display:none}
.pxc{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
